<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inloggen · Kerndossiers Landgoed De Stille Wille</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1F7F4E">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Mulish:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/components.css">
<style>
  .auth-wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 48px var(--page-pad-x-mobile);
    background: var(--cream);
  }
  .auth-card {
    width: 100%;
    max-width: 440px;
    background: var(--white);
    border: 1px solid var(--green-15);
    border-top: 4px solid var(--green);
    border-radius: 12px;
    padding: 40px 36px;
    box-shadow: 0 12px 40px rgba(19, 78, 47, 0.08);
  }
  .auth-kicker {
    font-family: var(--font-mono);
    font-size: var(--fs-mono);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--green);
    font-weight: 600;
    margin: 0 0 14px;
  }
  .auth-card h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 30px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--grey-dark);
    margin: 0 0 10px;
  }
  .auth-card .lede {
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    color: var(--grey-mid);
    margin: 0 0 26px;
  }
  .auth-field { margin-bottom: 18px; }
  .auth-field label {
    display: block;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13px;
    color: var(--grey-dark);
    margin-bottom: 6px;
  }
  .auth-field input {
    width: 100%;
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--grey-dark);
    background: var(--white);
    border: 1px solid var(--green-25);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .auth-field input:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px var(--green-08);
  }
  .auth-btn {
    width: 100%;
    border: 0;
    border-radius: 8px;
    background: var(--green);
    color: #fff;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
    padding: 13px 26px;
    cursor: pointer;
    transition: background .2s ease;
  }
  .auth-btn:hover:not(:disabled),
  .auth-btn:focus-visible { background: var(--green-deep); }
  .auth-btn:disabled { opacity: .6; cursor: default; }
  .auth-msg {
    margin: 20px 0 0;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.55;
  }
  .auth-msg.ok {
    background: var(--green-tint);
    border: 1px solid var(--green-15);
    color: var(--green-deep);
  }
  .auth-msg.err {
    background: var(--orange-tint);
    border: 1px solid var(--orange);
    color: var(--orange-deep);
  }
  .auth-foot {
    margin: 24px 0 0;
    font-size: 13.5px;
    color: var(--grey-soft);
    text-align: center;
  }
  .auth-foot a { color: var(--green); text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <p class="auth-kicker">Kerndossiers · De Stille Wille</p>
    <h1>Inloggen</h1>
    <p class="lede">Vul uw e-mailadres in. U ontvangt een toegangslink waarmee u zonder wachtwoord kunt inloggen.</p>

    <form id="login-form" novalidate>
      <div class="auth-field">
        <label for="email">E-mailadres</label>
        <input type="email" id="email" name="email" autocomplete="email"
               placeholder="naam@voorbeeld.nl" required>
      </div>
      <button type="submit" class="auth-btn" id="submit-btn">Stuur toegangslink</button>
    </form>

    <div id="msg" class="auth-msg" hidden></div>

    <p class="auth-foot">
      Nog geen toegang? <a href="/aanvragen.html">Vraag toegang aan</a>.
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script>
(function () {
  'use strict';
  var form = document.getElementById('login-form');
  var emailInput = document.getElementById('email');
  var btn = document.getElementById('submit-btn');
  var msg = document.getElementById('msg');

  var REDIRECT_TO = 'https://kerndossiers-stillewille.vercel.app/auth-callback.html';

  function show(text, kind) {
    msg.textContent = text;
    msg.className = 'auth-msg ' + kind;
    msg.hidden = false;
  }

  // Vriendelijke melding wanneer de gebruiker hierheen kwam door een
  // verlopen sessie (?reden=verlopen, gezet door de Edge Middleware).
  if (new URLSearchParams(location.search).get('reden') === 'verlopen') {
    show('Uw sessie is verlopen. Vraag een nieuwe toegangslink aan.', 'err');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = (emailInput.value || '').trim();
    if (!email) { show('Vul een geldig e-mailadres in.', 'err'); return; }

    btn.disabled = true;
    btn.textContent = 'Versturen…';
    msg.hidden = true;

    window.sb.auth.signInWithOtp({
      email: email,
      options: { emailRedirectTo: REDIRECT_TO }
    }).then(function (res) {
      if (res.error) {
        show('Er ging iets mis: ' + res.error.message, 'err');
        btn.disabled = false;
        btn.textContent = 'Stuur toegangslink';
        return;
      }
      show('Controleer uw e-mail voor de toegangslink.', 'ok');
      btn.textContent = 'Link verstuurd';
      form.querySelector('.auth-field').style.display = 'none';
    }).catch(function (err) {
      show('Er ging iets mis: ' + (err && err.message ? err.message : err), 'err');
      btn.disabled = false;
      btn.textContent = 'Stuur toegangslink';
    });
  });
})();
</script>
<script src="/footer.js"></script>
</body>
</html>
