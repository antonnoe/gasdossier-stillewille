name: Supabase backup

# Wekelijkse export van de Supabase-database naar een workflow-artifact.
#
# Waarom: het project draait op het gratis Supabase-plan en dat maakt geen
# automatische backups. Gaat er iets mis (een verkeerde DELETE, een verlopen
# project), dan is er zonder deze workflow niets om op terug te vallen.
#
# Wat er wordt geëxporteerd (drie losse bestanden, zoals de Supabase CLI ze
# aanlevert):
#   schema.sql  structuur van public + auth (tabellen, functies, RLS-policies)
#   data.sql    de rijen uit public + auth (dus ook de accounts zelf)
#   roles.sql   database-rollen
#
# Het auth-schema zit er bewust bij: daar staan de Supabase-accounts in.
# Zonder dat schema kun je de site wel herbouwen, maar moet iedereen zich
# opnieuw laten autoriseren.
#
# Benodigd repository-secret: SUPABASE_DB_URL
#   Supabase-dashboard -> Project Settings -> Database -> Connection string.
#   Zie README.md, sectie "Backups", voor de precieze stappen.
#
# Let op: het artifact bevat persoonsgegevens (e-mailadressen van bewoners).
# Het is alleen te downloaden door wie toegang heeft tot deze repository.
# Bewaartermijn: 90 dagen (het maximum dat GitHub Actions toestaat).
#
# Let op 2: GitHub schakelt geplande workflows automatisch uit als de
# repository 60 dagen geen enkele commit heeft gehad. Blijft het lang stil,
# controleer dan het Actions-tabblad en zet de workflow zo nodig weer aan.

on:
  schedule:
    # Elke maandag om 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Controleer of het secret is gezet
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Het repository-secret SUPABASE_DB_URL ontbreekt."
            echo "Zet het via Settings -> Secrets and variables -> Actions."
            echo "De waarde staat in het Supabase-dashboard onder"
            echo "Project Settings -> Database -> Connection string."
            exit 1
          fi

      - name: Supabase CLI installeren
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Database exporteren
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p backup

          # Structuur van public én auth.
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            --schema public,auth \
            -f backup/schema.sql

          # Inhoud van dezelfde schema's.
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            --schema public,auth \
            --data-only \
            -f backup/data.sql

          # Database-rollen (los, want die horen niet bij een schema).
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            --role-only \
            -f backup/roles.sql

      - name: Controleer dat de export niet leeg is
        run: |
          set -euo pipefail
          for f in backup/schema.sql backup/data.sql backup/roles.sql; do
            if [ ! -s "$f" ]; then
              echo "$f is leeg — de export is mislukt."
              exit 1
            fi
            echo "$f: $(wc -l < "$f") regels"
          done

      - name: Backup als artifact opslaan
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
          if-no-files-found: error
