<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Zoeken · Kerndossiers Landgoed De Stille Wille</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1F7F4E">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Mulish:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/components.css">
<style>
  .zoek-top { background: var(--green-deep); padding: 14px var(--page-pad-x); }
  .zoek-top-inner { max-width: var(--content-max); margin: 0 auto; }
  .zoek-top a { color: rgba(255,255,255,.85); text-decoration: none; font-size: 14px; font-family: var(--font-display); font-weight: 600; }
  .zoek-top a:hover { color: #fff; }

  .zoek-form { max-width: 640px; }
  .zoek-form .veld { display: flex; gap: 8px; }
  .zoek-form input[type="search"] {
    flex: 1 1 auto; min-width: 0;
    font-family: var(--font-body); font-size: 16px; color: var(--grey-dark);
    background: var(--white); border: 1px solid var(--green-25); border-radius: 8px; padding: 12px 14px;
  }
  .zoek-form input[type="search"]:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-08); }
  .zoek-form button {
    display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer;
    background: var(--green); color: #fff; font-family: var(--font-display); font-weight: 600; font-size: 15px;
    border-radius: 8px; padding: 0 22px;
  }
  .zoek-form button:hover { background: var(--green-deep); }

  .zoek-status { font-size: 15px; color: var(--grey-mid); margin: 28px 0 8px; }

  .zoek-resultaten { margin-top: 8px; }
  .zoek-res {
    display: block; text-decoration: none; color: inherit;
    padding: 20px 0; border-top: 1px solid var(--green-15);
  }
  .zoek-res:last-child { border-bottom: 1px solid var(--green-15); }
  .zoek-res:hover { background: var(--cream); }
  .zoek-res-titel {
    font-family: var(--font-display); font-weight: 700; font-size: 19px;
    color: var(--green-deep); margin: 0 0 4px;
  }
  .zoek-res-url { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--grey-soft); margin: 0 0 8px; }
  .zoek-res-snippet { font-size: 14.5px; line-height: 1.6; color: var(--grey-dark); margin: 0; }
  .zoek-res-aantal { font-family: var(--font-mono); font-size: 11px; color: var(--green); margin-left: 8px; }
  mark { background: #FFE680; color: var(--grey-dark); padding: 0 1px; border-radius: 2px; }

  @media (max-width: 700px) {
    .zoek-top { padding: 12px var(--page-pad-x-mobile); }
  }
</style>
</head>
<body>

<div class="zoek-top"><div class="zoek-top-inner"><a href="/index.html">← Terug naar de dossiers</a></div></div>

<header class="page-header">
  <div class="page-header-inner">
    <div class="page-kicker"><span class="square"></span> Zoeken</div>
    <h1 class="page-title">Zoeken</h1>
    <form class="zoek-form" id="zoek-form" role="search">
      <div class="veld">
        <input type="search" id="zoek-input" name="q" placeholder="Zoek in alle dossiers…" aria-label="Zoekterm" autocomplete="off">
        <button type="submit">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Zoeken
        </button>
      </div>
    </form>
  </div>
</header>

<main class="page-main">
  <div class="zoek-status" id="zoek-status"></div>
  <div class="zoek-resultaten" id="zoek-resultaten"></div>
</main>

<footer class="sw-footer">
  <strong>Kerndossiers Landgoed De Stille Wille</strong> — dit is een groeiend dossier. Meer onderwerpen volgen.
</footer>

<!-- Register als single source of truth voor de te doorzoeken pagina's -->
<script src="/dossiers.js"></script>
<script>
(function () {
  'use strict';

  // Te doorzoeken pagina's — afgeleid uit het dossier-register (dossiers.js),
  // zodat nieuwe dossiers en secties automatisch doorzoekbaar zijn.
  //   - elk top-level dossier  -> /<slug>.html
  //   - elke sectie met pagina -> /<sectie.pagina>
  // Aangevuld met losse pagina's die (bewust) niet in het register staan.
  var LOSSE_PAGINAS = [
    '/index.html',
    '/overzicht.html',
    '/kostenverdeling-gas.html'
  ];

  function bouwPaginalijst() {
    var uniek = {};
    var lijst = [];
    function voegToe(pad) {
      if (pad && !uniek[pad]) { uniek[pad] = true; lijst.push(pad); }
    }

    LOSSE_PAGINAS.forEach(voegToe);

    (window.SW_DOSSIERS || []).forEach(function (d) {
      if (d.slug) voegToe('/' + d.slug + '.html');
      (d.secties || []).forEach(function (s) {
        if (s.pagina) voegToe('/' + s.pagina);
      });
    });

    return lijst;
  }

  var PAGINAS = bouwPaginalijst();

  var form = document.getElementById('zoek-form');
  var input = document.getElementById('zoek-input');
  var statusEl = document.getElementById('zoek-status');
  var lijstEl = document.getElementById('zoek-resultaten');

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  // Splits de zoekopdracht in losse woorden. Een pagina telt als treffer
  // wanneer ALLE woorden erop voorkomen (AND-logica); ze hoeven niet naast
  // elkaar te staan. "erfpacht 2028" vindt dus ook pagina's waar die woorden
  // in verschillende zinnen staan. Een frase tussen "dubbele aanhalingstekens"
  // wordt wél als geheel gezocht.
  function parseTermen(term) {
    var frasen = [];
    term = term.replace(/"([^"]+)"/g, function (m, f) { frasen.push(f.trim()); return ' '; });
    var woorden = term.split(/\s+/).filter(function (w) { return w.length > 0; });
    return frasen.concat(woorden);
  }

  // Maak een snippet rond de eerste treffer, met de term gemarkeerd.
  function maakSnippet(text, term) {
    var lower = text.toLowerCase();
    var idx = lower.indexOf(term.toLowerCase());
    if (idx === -1) return '';
    var start = Math.max(0, idx - 70);
    var eind = Math.min(text.length, idx + term.length + 110);
    var snip = (start > 0 ? '… ' : '') + text.slice(start, eind).trim() + (eind < text.length ? ' …' : '');
    var rx = new RegExp(escapeRegExp(term), 'gi');
    return escapeHtml(snip).replace(rx, function (m) { return '<mark>' + m + '</mark>'; });
  }

  function telTreffers(text, term) {
    var rx = new RegExp(escapeRegExp(term), 'gi');
    var m = text.match(rx);
    return m ? m.length : 0;
  }

  // Eén pagina ophalen en doorzoeken.
  function zoekPagina(url, term) {
    return fetch(url).then(function (resp) {
      if (!resp.ok) return null;
      return resp.text();
    }).then(function (html) {
      if (!html) return null;
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var titel = (doc.querySelector('title') && doc.querySelector('title').textContent || url).split('·')[0].trim() || url;
      // Navigatie, voettekst en scripts weglaten uit de doorzochte tekst.
      var weg = doc.querySelectorAll('script, style, nav, footer, .sw-nav, .sw-footer');
      for (var i = 0; i < weg.length; i++) weg[i].parentNode && weg[i].parentNode.removeChild(weg[i]);
      var bron = doc.body || doc.documentElement;
      var text = (bron.textContent || '').replace(/\s+/g, ' ').trim();
      var lower = text.toLowerCase();
      var termen = parseTermen(term);
      if (!termen.length) return null;
      // AND-logica: elke term moet op de pagina voorkomen.
      for (var t = 0; t < termen.length; t++) {
        if (lower.indexOf(termen[t].toLowerCase()) === -1) return null;
      }
      var totaal = 0;
      for (var t2 = 0; t2 < termen.length; t2++) totaal += telTreffers(text, termen[t2]);
      // Snippet rond de langste (meest onderscheidende) term; markeer daarna alle termen.
      var langste = termen.slice().sort(function (a, b) { return b.length - a.length; })[0];
      var snip = maakSnippet(text, langste);
      for (var t3 = 0; t3 < termen.length; t3++) {
        if (termen[t3] === langste) continue;
        var rx = new RegExp('(?![^<]*>)' + escapeRegExp(escapeHtml(termen[t3])), 'gi');
        snip = snip.replace(rx, function (m) { return '<mark>' + m + '</mark>'; });
      }
      return {
        url: url,
        titel: titel,
        aantal: totaal,
        snippet: snip
      };
    }).catch(function () { return null; });
  }

  function toon(resultaten, term) {
    lijstEl.innerHTML = '';
    if (!resultaten.length) {
      statusEl.textContent = 'Geen resultaten voor “' + term + '”.';
      return;
    }
    resultaten.sort(function (a, b) { return b.aantal - a.aantal; });
    statusEl.innerHTML = '<strong>' + resultaten.length + (resultaten.length === 1 ? ' pagina' : ' pagina’s') +
      '</strong> met resultaten voor &ldquo;' + escapeHtml(term) + '&rdquo;.';

    resultaten.forEach(function (r) {
      var a = document.createElement('a');
      a.className = 'zoek-res';
      a.href = r.url;
      a.innerHTML =
        '<p class="zoek-res-titel">' + escapeHtml(r.titel) +
        '<span class="zoek-res-aantal">' + r.aantal + (r.aantal === 1 ? ' treffer' : ' treffers') + '</span></p>' +
        '<p class="zoek-res-url">' + escapeHtml(r.url) + '</p>' +
        '<p class="zoek-res-snippet">' + r.snippet + '</p>';
      lijstEl.appendChild(a);
    });
  }

  function zoek(term) {
    term = (term || '').trim();
    if (!term) { statusEl.textContent = 'Vul een zoekterm in.'; lijstEl.innerHTML = ''; return; }

    statusEl.textContent = 'Bezig met zoeken naar “' + term + '”…';
    lijstEl.innerHTML = '';

    Promise.all(PAGINAS.map(function (url) { return zoekPagina(url, term); }))
      .then(function (resultaten) {
        toon(resultaten.filter(function (r) { return r; }), term);
      });
  }

  // Formulier verstuurt naar zichzelf (?q=), zodat de URL deelbaar/bladwijzerbaar is.
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var term = (input.value || '').trim();
    if (!term) { input.focus(); return; }
    var nieuweUrl = '/zoeken.html?q=' + encodeURIComponent(term);
    if (location.search !== ('?q=' + encodeURIComponent(term))) {
      history.replaceState(null, '', nieuweUrl);
    }
    zoek(term);
  });

  // Bij laden: q uit de URL halen, invullen en meteen zoeken.
  var q = new URLSearchParams(location.search).get('q') || '';
  if (q) { input.value = q; zoek(q); }
  else { statusEl.textContent = 'Typ een zoekterm en druk op Enter.'; input.focus(); }
})();
</script>
<script src="/footer.js"></script>
</body>
</html>
