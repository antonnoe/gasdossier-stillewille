<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Toegang aanvragen · Kerndossiers Landgoed De Stille Wille</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1F7F4E">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Mulish:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/components.css">
<style>
  .auth-wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 48px var(--page-pad-x-mobile);
    background: var(--cream);
  }
  .auth-card {
    width: 100%;
    max-width: 480px;
    background: var(--white);
    border: 1px solid var(--green-15);
    border-top: 4px solid var(--green);
    border-radius: 12px;
    padding: 40px 36px;
    box-shadow: 0 12px 40px rgba(19, 78, 47, 0.08);
  }
  .auth-kicker {
    font-family: var(--font-mono);
    font-size: var(--fs-mono);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--green);
    font-weight: 600;
    margin: 0 0 14px;
  }
  .auth-card h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 30px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--grey-dark);
    margin: 0 0 10px;
  }
  .auth-card .lede {
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    color: var(--grey-mid);
    margin: 0 0 26px;
  }
  .auth-field { margin-bottom: 18px; }
  .auth-field label {
    display: block;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13px;
    color: var(--grey-dark);
    margin-bottom: 6px;
  }
  .auth-field .optional { font-weight: 400; color: var(--grey-soft); }
  .auth-field input,
  .auth-field textarea {
    width: 100%;
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--grey-dark);
    background: var(--white);
    border: 1px solid var(--green-25);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .auth-field textarea { resize: vertical; min-height: 90px; line-height: 1.5; font-size: 15px; }
  .auth-field input:focus,
  .auth-field textarea:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px var(--green-08);
  }
  .auth-btn {
    width: 100%;
    border: 0;
    border-radius: 8px;
    background: var(--green);
    color: #fff;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
    padding: 13px 26px;
    cursor: pointer;
    transition: background .2s ease;
  }
  .auth-btn:hover:not(:disabled),
  .auth-btn:focus-visible { background: var(--green-deep); }
  .auth-btn:disabled { opacity: .6; cursor: default; }
  .auth-msg {
    margin: 20px 0 0;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.55;
  }
  .auth-msg.ok {
    background: var(--green-tint);
    border: 1px solid var(--green-15);
    color: var(--green-deep);
  }
  .auth-msg.err {
    background: var(--orange-tint);
    border: 1px solid var(--orange);
    color: var(--orange-deep);
  }
  .auth-foot {
    margin: 24px 0 0;
    font-size: 13.5px;
    color: var(--grey-soft);
    text-align: center;
  }
  .auth-foot a { color: var(--green); text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <p class="auth-kicker">Kerndossiers · De Stille Wille</p>
    <h1>Toegang aanvragen</h1>
    <p class="lede">Bewoner van Landgoed De Stille Wille? Vraag hieronder toegang aan tot de kerndossiers. Een beheerder beoordeelt uw aanvraag.</p>

    <form id="aanvraag-form" novalidate>
      <div class="auth-field">
        <label for="naam">Naam</label>
        <input type="text" id="naam" name="naam" autocomplete="name" required>
      </div>
      <div class="auth-field">
        <label for="email">E-mailadres</label>
        <input type="email" id="email" name="email" autocomplete="email"
               placeholder="naam@voorbeeld.nl" required>
      </div>
      <div class="auth-field">
        <label for="type">Ik ben…</label>
        <select id="type" name="type" required>
          <option value="">Maak een keuze…</option>
          <option value="bewoner">Bewoner (met huisnummer)</option>
          <option value="lsw">Directie LSW</option>
          <option value="swb">Directie SWB</option>
          <option value="dienstverlener">Dienstverlener (tijdelijke toegang)</option>
        </select>
      </div>
      <div class="auth-field" id="huisnummer-veld" hidden>
        <label for="huisnummer">Huisnummer <span class="optional">(001–326)</span></label>
        <input type="text" id="huisnummer" name="huisnummer" inputmode="numeric"
               pattern="[0-9]{3}" maxlength="3" placeholder="bijv. 042" autocomplete="off">
      </div>
      <div id="derden-velden" hidden>
        <div class="auth-field">
          <label for="telefoon">Telefoonnummer</label>
          <input type="tel" id="telefoon" name="telefoon" autocomplete="tel"
                 placeholder="bijv. 06-12345678">
        </div>
        <div class="auth-field">
          <label for="uitgenodigd">Wie heeft u uitgenodigd?</label>
          <input type="text" id="uitgenodigd" name="uitgenodigd"
                 placeholder="Naam (en evt. huisnummer) van uw contactpersoon">
        </div>
        <div class="auth-field">
          <label for="duur">Hoe lang wenst u toegang?</label>
          <input type="text" id="duur" name="duur"
                 placeholder="bijv. 2 weken, of tot 1 augustus 2026">
        </div>
      </div>
      <div class="auth-field">
        <label for="reden">Reden <span class="optional">(optioneel)</span></label>
        <textarea id="reden" name="reden" placeholder="Bijv. uw adres of relatie tot het landgoed."></textarea>
      </div>
      <button type="submit" class="auth-btn" id="submit-btn">Aanvraag versturen</button>
    </form>

    <div id="msg" class="auth-msg" hidden></div>

    <p class="auth-foot">
      Al toegang? <a href="/login.html">Inloggen</a>.
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script>
(function () {
  'use strict';
  var form = document.getElementById('aanvraag-form');
  var btn = document.getElementById('submit-btn');
  var msg = document.getElementById('msg');
  var typeSel = document.getElementById('type');
  var huisVeld = document.getElementById('huisnummer-veld');
  var huisInput = document.getElementById('huisnummer');
  var derdenVeld = document.getElementById('derden-velden');
  var telefoonInput = document.getElementById('telefoon');
  var uitgenodigdInput = document.getElementById('uitgenodigd');
  var duurInput = document.getElementById('duur');

  function show(text, kind) {
    msg.textContent = text;
    msg.className = 'auth-msg ' + kind;
    msg.hidden = false;
  }

  // Huisnummer alleen voor bewoners; extra controlevelden alleen voor derden.
  typeSel.addEventListener('change', function () {
    var bewoner = typeSel.value === 'bewoner';
    var derde = typeSel.value === 'dienstverlener';
    huisVeld.hidden = !bewoner;
    derdenVeld.hidden = !derde;
    if (!bewoner) huisInput.value = '';
    if (!derde) { telefoonInput.value = ''; uitgenodigdInput.value = ''; duurInput.value = ''; }
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var naam = (document.getElementById('naam').value || '').trim();
    var email = (document.getElementById('email').value || '').trim();
    var reden = (document.getElementById('reden').value || '').trim();
    var type = typeSel.value;
    var huisnummer = (huisInput.value || '').trim();
    var telefoon = (telefoonInput.value || '').trim();
    var uitgenodigd = (uitgenodigdInput.value || '').trim();
    var duur = (duurInput.value || '').trim();

    if (!naam || !email) { show('Vul uw naam en e-mailadres in.', 'err'); return; }
    if (!type) { show('Geef aan wie u bent.', 'err'); return; }
    if (type === 'bewoner') {
      var nr = parseInt(huisnummer, 10);
      if (!/^[0-9]{3}$/.test(huisnummer) || nr < 1 || nr > 326) {
        show('Vul een geldig huisnummer in (001 t/m 326).', 'err'); huisInput.focus(); return;
      }
    }
    if (type === 'dienstverlener' && (!telefoon || !uitgenodigd || !duur)) {
      show('Vul voor een dienstverlener telefoonnummer, uitnodiger en gewenste duur in.', 'err'); return;
    }

    btn.disabled = true;
    btn.textContent = 'Versturen…';
    msg.hidden = true;

    window.sb.from('aanvragen').insert({
      naam: naam,
      email: email,
      reden: reden || null,
      categorie: type,
      huisnummer: (type === 'bewoner') ? huisnummer : null,
      telefoon: (type === 'dienstverlener') ? telefoon : null,
      uitgenodigd_door: (type === 'dienstverlener') ? uitgenodigd : null,
      gewenste_duur: (type === 'dienstverlener') ? duur : null,
      status: 'pending'
    }).then(function (res) {
      if (res.error) {
        show('Er ging iets mis: ' + res.error.message, 'err');
        btn.disabled = false;
        btn.textContent = 'Aanvraag versturen';
        return;
      }
      show('Bedankt! Uw aanvraag is ontvangen. U hoort van een beheerder zodra deze is beoordeeld.', 'ok');
      btn.textContent = 'Aanvraag verstuurd';
      form.querySelectorAll('.auth-field').forEach(function (f) { f.style.display = 'none'; });
    }).catch(function (err) {
      show('Er ging iets mis: ' + (err && err.message ? err.message : err), 'err');
      btn.disabled = false;
      btn.textContent = 'Aanvraag versturen';
    });
  });
})();
</script>
<script src="/footer.js"></script>
</body>
</html>
